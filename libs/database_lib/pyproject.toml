[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-lib"
version = "0.1.0"
description = "Shared structured database connection management utilities for microservices"
readme = "README.md"
authors = [
    { name = "ElVirtualJefe", email = "info@virtualjefe.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Database"
]
requires-python = ">=3.10"
debendencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/database_lib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
