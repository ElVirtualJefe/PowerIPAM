[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-lib"
version = "0.1.0"
description = "Common Database Library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.46",
    "psycopg2>=2.9.11"
]

[tool.hatch.build.targets.wheel]
packages = ["src/database_lib"]
