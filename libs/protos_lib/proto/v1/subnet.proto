syntax = "proto3";

package poweripam.v1;

import "google/protobuf/timestamp.proto";

service SubnetService {
    rpc GetSubnetById (SubnetRequest) returns (SubnetResponse);
    rpc AddSubnet (Subnet) returns (SubnetResponse);
    rpc UpdateSubnet (Subnet) returns (SubnetResponse);
    rpc DeleteSubnetById (SubnetRequest) returns (SubnetResponse);
}

message Subnet {
    string id = 1;
    string name = 2;
    string cidr = 3;
    string description = 4;
    poweripam.StateId state_id = 5;
    string vlan_id = 6;
    bool allow_requests = 7;

    google.protobuf.Timestamp last_scanned = 13;
    google.protobuf.Timestamp last_seen = 14;
    google.protobuf.Timestamp last_modified = 15;
    google.protobuf.Timestamp date_created = 16;
}

message SubnetRequest {
    oneof request_field {
        string id = 1;
        string name = 2;
    }
}

message SubnetResponse {
    repeated Subnet subnet = 1;
}
