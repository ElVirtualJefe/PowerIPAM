[build-system]
requires = ["hatchling", "grpcio-tools>=1.71.0"]
build-backend = "hatchling.build"

[project]
name = "protos-lib"
version = "0.1.0"
description = "Shared protocol buffer schemas and generated Python stubs for PowerIPAM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.26.1",
    "grpcio>=1.76.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protos_lib"]
