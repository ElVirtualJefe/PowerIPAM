[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-ui-service"
version = "0.1.0"
description = "Web UI Microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "grpcio-tools",
    "logging-lib>=0.1.0",
    "database-lib>=0.1.0",
    "SQLAlchemy>=2.0.46",
    "protobuf>=6.33.4",
    "psycopg2>2.9.11"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
